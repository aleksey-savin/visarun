services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-prod
      args:
        - NODE_ENV=production
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - uploads:/app/backend/uploads
    depends_on:
      - postgres
    restart: always

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=https://visarunvietnam.com/api
      - LOG_LEVEL=info
    depends_on:
      - backend
    restart: always

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: webapp-prod
      args:
        - VITE_API_URL=https://visarunvietnam.com # Use your production API URL
    ports:
      - "80:80"
    restart: always
    # You might need volume mounts for SSL certificates
    # volumes:
    #   - ./certs:/etc/nginx/certs

  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    # Consider not exposing the port in production
    # Comment this out if you don't need direct access from host
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  uploads:
